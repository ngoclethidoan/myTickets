{% extends "auth_base.html" %}
{% block title %}Sign in · myTickets{% endblock %}
{% block form %}
<h1>Sign in</h1>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
  <div class="field"><label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" value="{{ username }}" required autofocus></div>
  <div class="field"><label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn-block" type="submit">Sign in</button>
</form>
<p class="muted">New to myTickets? <a class="hl" href="{{ url_for('signup') }}">Sign up</a></p>
<p class="muted small">Admins sign in here too and are taken to the dashboard.</p>
{% endblock %}
